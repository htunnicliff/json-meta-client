# Disposable, local-only Stalwart instance. Never use these credentials in production.
[server]
hostname = "localhost"

[server.listener.http]
bind = ["[::]:8080"]
protocol = "http"

[storage]
data = "rocksdb"
fts = "rocksdb"
blob = "rocksdb"
lookup = "rocksdb"
directory = "internal"

[store.rocksdb]
type = "rocksdb"
path = "/opt/stalwart-mail/data"
compression = "lz4"

[directory.internal]
type = "internal"
store = "rocksdb"

[authentication.fallback-admin]
user = "admin"
secret = "integration-admin-password"

[tracer.stdout]
type = "stdout"
level = "info"
ansi = false
enable = true

# Advertise the request host, including Docker's dynamically mapped port.
[server.http]
url = [
  { if = "matches('(?m)^host: ([^\\r\\n]+)', headers)", then = "protocol + '://' + $1" },
  { else = "protocol + '://localhost:8080'" },
]

[spam-filter.pyzor]
enable = false
