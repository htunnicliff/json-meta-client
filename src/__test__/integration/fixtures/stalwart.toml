[server.listener.http]
bind = ["[::]:8080"]
protocol = "http"

[storage]
data = "rocksdb"
fts = "rocksdb"
blob = "rocksdb"
lookup = "rocksdb"
directory = "internal"

[store.rocksdb]
type = "rocksdb"
path = "/opt/stalwart-mail/data"

[directory.internal]
type = "internal"
store = "rocksdb"

[authentication.fallback-admin]
user = "admin"
secret = "integration-admin-password"

[tracer.stdout]
type = "stdout"
ansi = false

# Advertise the request host, including Docker's dynamically mapped port.
[server.http]
url = [
  { if = "matches('(?m)^host: ([^\\r\\n]+)', headers)", then = "protocol + '://' + $1" },
  { else = "protocol + '://localhost:8080'" },
]

[spam-filter.pyzor]
enable = false
